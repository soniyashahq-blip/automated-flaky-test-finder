[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flaky-test-finder"
version = "0.1.0"
description = "Automated flaky test detection, diagnosis, fixing and verification"
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[project.scripts]
flaky-finder = "flaky_finder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["flaky_finder*"]